# Swat Reviewer — runs the bot on every PR. Installed by /handle-it-project-setup.
#
# This is the ONLY file a repo needs once the org/repo prerequisites exist: a
# CLAUDE_CODE_OAUTH_TOKEN secret, and (optionally, for the branded App identity
# that enables thread resolution + risk-based auto-approval) the
# SWAT_REVIEWER_APP_PRIVATE_KEY secret + SWAT_REVIEWER_APP_ID variable.
# Just commit this caller to the default branch and reviews start on the next PR.
# (Setup details: the toolkit repo's docs/github-bot/README.md.)
#
# Canonical copy — keep docs/github-bot/caller-workflow.yml in sync with this file.

name: Swat Reviewer
on:
  pull_request:
    # opened + synchronize covers new PRs and every push, drafts included.
    # ready_for_review re-runs on un-draft so a PR that already cleared the bar
    # (Quality 5/5 ∧ Spec 5/5 ∧ Risk ≥ 4) gets its formal Approve — the reviewer
    # fast-paths it (just approves, no re-review) when the diff is unchanged since
    # the last pass, so the un-draft doesn't waste a full review.
    types: [opened, synchronize, ready_for_review]

# A reusable workflow's job can't request more than the caller grants, so the
# caller MUST grant the permissions the review job needs. (Required — without
# this the call fails at parse time if the repo's default token is restricted.)
permissions:
  contents: read
  pull-requests: write

# Cancel an in-flight review when a newer commit is pushed to the same PR.
concurrency:
  group: swat-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts ARE reviewed by default. To skip drafts, uncomment the next line
    # (`ready_for_review` is already in the triggers above, so the PR is still
    # reviewed + approved once it leaves draft):
    # if: ${{ github.event.pull_request.draft == false }}
    # Pin @main to a tag/SHA once you cut a release for reproducible reviews.
    uses: swatkinson/swatkinson-cc-toolkit/.github/workflows/swat-review.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Branded Swat Reviewer App identity (enables thread resolution +
      # risk-based auto-approval). Requires the App installed on this repo.
      # To opt OUT for a repo, delete this line and the app_id line below →
      # comments fall back to github-actions[bot].
      app_private_key: ${{ secrets.SWAT_REVIEWER_APP_PRIVATE_KEY }}
    with:
      app_id: ${{ vars.SWAT_REVIEWER_APP_ID }}
      # Optional overrides:
      # model: opus
      # toolkit_ref: v1.1.0
